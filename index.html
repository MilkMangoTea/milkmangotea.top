    <title>HomePage</title>
    <meta name="description" content="这是一个主页"/>
    <meta name="theme-color" content="#0b1220"/>

    <script>
        // 默认跟随系统主题；点击右上角灯泡后记住手动选择。
        (() => {
            const KEY = 'homepage-theme-demo-v2';
            let saved = null;
            try {
                const value = localStorage.getItem(KEY);
                if (value === 'light' || value === 'dark') saved = value;
            } catch (_) {}
            const actual = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.dataset.theme = actual;
        })();
    </script>

    <style>
        /* ====== Design Tokens (冷色调 / 深色) ====== */
        :root {
            --mouse-x: 72vw;
            --mouse-y: 26vh;
            --mouse-active: 0;

            --bg: #0b1220; /* 深黑蓝 */
            --panel: rgba(12, 16, 30, .55); /* 玻璃态 */
            --border: rgba(172, 195, 255, .16);
            --text: #eaf5ff; /* 近白 */
            --muted: #9db3c7; /* 次级文字 */
            --acc: #7dd3fc; /* 冰蓝 */
            --acc-2: #c7d2fe; /* 冷紫 */
            --ring: rgba(125, 211, 252, .25);
            --shadow: 0 20px 60px rgba(2, 8, 23, .6);
            --mx: 70%;
            --my: 20%; /* 动态背景坐标 */
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fbff;
                --panel: rgba(255, 255, 255, .7);
                --border: rgba(46, 78, 120, .15);
                --text: #0b1220;
                --muted: #4e6375;
                --ring: rgba(56, 189, 248, .35);
            }
        }

        * {
            box-sizing: border-box
        }

        html {
            height: 100%;
            background: var(--bg);
            overscroll-behavior: none;
            overscroll-behavior-y: none;
        }

        body {
            margin: 0;
            color: var(--text);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
            position: relative; /* 统一堆叠上下文，视口级背景不露白 */
            /* 分层渐变 + 鼠标响应光斑 */
            background: radial-gradient(800px 600px at var(--mx) var(--my), rgba(125, 211, 252, .18), transparent 60%),
            radial-gradient(1000px 700px at 10% 90%, rgba(199, 210, 254, .12), transparent 70%),
            linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
            overflow-x: hidden;
            min-height: 100%;
            overscroll-behavior: none;
            overscroll-behavior-y: none;
        }

        /* 细腻噪点/星点层（冷色调） */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(rgba(165, 243, 252, .06) 1px, transparent 1px);
            background-size: 40px 40px;
            mix-blend-mode: screen;
            opacity: .7;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity .18s ease;
        }

        html[data-theme="dark"] body::after {
            opacity: calc(.95 * var(--mouse-active));
            background:
                radial-gradient(
                    210px 210px at var(--mouse-x) var(--mouse-y),
                    rgba(112, 241, 255, .18) 0%,
                    rgba(70, 190, 255, .12) 26%,
                    rgba(109, 102, 255, .08) 48%,
                    rgba(28, 74, 152, .03) 62%,
                    transparent 76%
                );
            filter: blur(8px) saturate(118%);
            mix-blend-mode: screen;
        }

        @media (pointer: coarse) {
            html[data-theme="dark"] body::after {
                display: none;
            }
        }


        .container {
            position: relative;
            z-index: 3;
            max-width: 1160px;
            margin: 0 auto;
            padding: 28px 20px 80px
        }

        /* ====== Header ====== */
        header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(12px) saturate(110%);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(2, 8, 23, .5)
        }

        .name {
            font-size: 16px;
            font-weight: 700
        }

        .tagline {
            margin: 0;
            color: var(--muted);
            font-size: 12.5px
        }

        .spacer {
            flex: 1
        }

        .top-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0));
            color: inherit;
            text-decoration: none;
            font-size: 13px
        }

        /* ====== Hero ====== */
        .hero {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 24px;
            margin-top: 24px;
            align-items: center
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
            }
        }

        .title {
            margin: 0 0 14px;
            font-size: clamp(32px, 4.6vw, 68px);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(180deg, #dbeafe 0%, #7dd3fc 30%, #eaf5ff 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }

        .subtitle {
            margin: 0 0 18px;
            font-size: clamp(14px, 1.4vw, 18px);
            color: var(--muted)
        }
@keyframes breathe {
            0%, 100% {
                filter: drop-shadow(0 18px 36px rgba(56, 189, 248, .20)) drop-shadow(0 6px 18px rgba(2, 8, 23, .60));
            }
            50% {
                filter: drop-shadow(0 26px 58px rgba(56, 189, 248, .34)) drop-shadow(0 12px 28px rgba(2, 8, 23, .72));
            }
        }
/* ====== Panels & Cards ====== */
        .section {
            margin-top: 26px
        }

        .panel {
            padding: 18px;
            border: 1px solid var(--border);
            background: var(--panel);
            backdrop-filter: blur(10px) saturate(120%);
            border-radius: 20px;
            box-shadow: var(--shadow)
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(3, minmax(0, 1fr));
            gap: 14px
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns:repeat(2, minmax(0, 1fr))
            }
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns:1fr
            }
        }

        .card {
            position: relative;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .02));
            transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 42px rgba(2, 8, 23, .65);
            border-color: var(--ring)
        }

        .card a {
            color: inherit;
            text-decoration: none;
            display: block
        }

        .card h3 {
            margin: 0 0 6px;
            font-size: 16px;
            color: #e7f6ff
        }

        .card p {
            margin: 0;
            color: var(--muted);
            font-size: 13px
        }
footer {
            margin-top: 38px;
            color: var(--muted);
            font-size: 12px;
            text-align: center
        }

        /* 粒子雪花画布 */
        .fx-snow {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }
/* === 固定在右下角的立绘 === */
/* 浮动立绘固定在右下角，并轻微下压使脚部贴近视口底缘。 */
        .floating-illust {
            position: fixed;
            right: max(14px, 2.2vw);
            bottom: -10px; /* 向下压一点，让脚贴近视口底缘 */
            width: clamp(160px, 22vw, 320px);
            z-index: 4; /* 高于容器与雪花层 */
            pointer-events: none; /* 不遮挡点击 */
            transform: translateZ(0);
            filter: drop-shadow(0 20px 40px rgba(56, 189, 248, .22)) drop-shadow(0 8px 22px rgba(2, 8, 23, .7));
            animation: breathe 6.5s ease-in-out infinite;
        }

        @media (max-width: 900px) {
            .floating-illust {
                width: clamp(140px, 30vw, 260px);
                bottom: -8px;
            }
        }

        @media (max-width: 640px) {
            .floating-illust {
                width: clamp(120px, 36vw, 220px);
                bottom: -6px;
                right: max(10px, 3vw);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .floating-illust {
                animation: none !important;
            }
        }

        /* =========================================================
           Theme scenes
           Light = Warm Ocean / 温水海洋
           Dark  = Aurora Ice / 冰山极光
           ========================================================= */

        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #06101c;
            --bg-2: #0a192c;
            --bg-warm: #10263b;
            --panel: rgba(7, 14, 28, .46);
            --border: rgba(177, 214, 255, .17);
            --text: #eaf6ff;
            --muted: #9cb3c8;
            --acc: #8ce2ff;
            --acc-2: #7af7d3;
            --ring: rgba(140, 226, 255, .28);
            --shadow: 0 20px 60px rgba(1, 8, 22, .62);
            --shadow-hover: 0 20px 42px rgba(2, 8, 23, .68);
            --cursor-glow: rgba(125, 211, 252, .12);
            --corner-glow: rgba(92, 224, 196, .08);
            --title-1: #eef8ff;
            --title-2: #8ce2ff;
            --title-3: #baf7ea;
            --card-title: #edf8ff;
            --card-top: rgba(255, 255, 255, .045);
            --card-bottom: rgba(255, 255, 255, .018);
            --chip-top: rgba(255, 255, 255, .06);
            --chip-bottom: rgba(255, 255, 255, 0);
            --button-text: #eaf6ff;
        }

        html[data-theme="dark"] body {
            background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 58%, var(--bg-warm) 100%);
        }

        html[data-theme="light"] {
            color-scheme: light;
            --time-surface: #d3fbff;
            --time-mid: #acebe4;
            --time-deep: #6fbfc8;
            --time-sand: #f6dcae;
            --time-accent-rgb: 24, 142, 160;
            --time-sun-rgb: 255, 222, 145;
            --sun-x: 68%;
            --sun-y: -4%;

            /* Light 模式的大面板保持半透明，以保留水下背景层次。 */
            --panel: rgba(248, 255, 253, .20);
            --border: rgba(39, 116, 130, .25);
            --text: #123a43;
            --muted: #4d6e76;
            --acc: #0d8ca5;
            --acc-2: #4f79b5;
            --ring: rgba(20, 145, 162, .34);
            --shadow: 0 16px 42px rgba(35, 97, 107, .13);
            --shadow-hover: 0 18px 38px rgba(28, 91, 103, .18);
            --title-1: #12546a;
            --title-2: #078fa7;
            --title-3: #3978a7;
            --card-title: #174c58;
            --card-top: rgba(255, 255, 255, .40);
            --card-bottom: rgba(216, 245, 240, .20);
            --chip-top: rgba(255, 255, 255, .69);
            --chip-bottom: rgba(225, 247, 243, .42);
            --button-text: #123a43;
        }

        body {
            background:
                radial-gradient(820px 620px at var(--mx) var(--my), var(--cursor-glow), transparent 60%),
                radial-gradient(1000px 700px at 10% 90%, var(--corner-glow), transparent 70%),
                linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 58%, var(--bg-warm) 100%);
            transition: color .35s ease, background-color .35s ease;
        }

        html[data-theme="light"] body {
            background:
                linear-gradient(180deg,
                    var(--time-surface) 0%,
                    var(--time-mid) 42%,
                    var(--time-deep) 80%,
                    color-mix(in srgb, var(--time-sand) 58%, var(--time-deep)) 100%);
        }

        .container { padding-bottom: 185px; }

        .title {
            background: linear-gradient(135deg, var(--title-1) 0%, var(--title-2) 46%, var(--title-3) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .card {
            background: linear-gradient(145deg, var(--card-top), var(--card-bottom));
            box-shadow: inset 0 1px rgba(255,255,255,.18);
        }
        .card:hover { box-shadow: var(--shadow-hover), inset 0 1px rgba(255,255,255,.22); }
        .card h3 { color: var(--card-title); }
        .chip { background: linear-gradient(180deg, var(--chip-top), var(--chip-bottom)); }
        .btn { color: var(--button-text); }

        html[data-theme="light"] header {
            background: rgba(250,255,253,.48);
            backdrop-filter: blur(11px) saturate(112%);
            -webkit-backdrop-filter: blur(11px) saturate(112%);
        }

        html[data-theme="light"] .panel {
            background: linear-gradient(145deg,
                rgba(255,255,255,.23),
                rgba(218,246,242,.12));
            backdrop-filter: blur(5px) saturate(108%);
            -webkit-backdrop-filter: blur(5px) saturate(108%);
            box-shadow: 0 14px 32px rgba(31, 91, 101, .09), inset 0 1px rgba(255,255,255,.24);
        }

        html[data-theme="light"] .card {
            backdrop-filter: blur(4px) saturate(105%);
            -webkit-backdrop-filter: blur(4px) saturate(105%);
        }

        html[data-theme="light"] body::before {
            background-image: radial-gradient(rgba(255,255,255,.16) .7px, transparent .9px);
            background-size: 46px 46px;
            mix-blend-mode: soft-light;
            opacity: .28;
        }

        html[data-theme="dark"] body::before {
            background-image: radial-gradient(rgba(165, 243, 252, .05) 1px, transparent 1px);
            mix-blend-mode: screen;
            opacity: .58;
        }
/* ---------- DARK ---------- */

        .dark-scene::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 54vh;
            pointer-events: none;
            background:
                radial-gradient(42% 30% at 14% 10%, rgba(92, 255, 222, .18), transparent 68%),
                radial-gradient(44% 28% at 54% 8%, rgba(132, 116, 255, .16), transparent 70%),
                radial-gradient(40% 28% at 86% 12%, rgba(67, 236, 255, .17), transparent 70%),
                linear-gradient(to bottom, rgba(36, 78, 130, .10) 0%, rgba(18, 33, 62, .07) 34%, rgba(8, 19, 39, 0) 100%);
            filter: blur(26px);
            opacity: .90;
            z-index: 0;
        }

.dark-scene {
            position: absolute;
            inset: 0;
            min-height: 100%;
            z-index: 1;
            display: none;
            overflow: hidden;
            pointer-events: none;
        }
        html[data-theme="dark"] .dark-scene { display: block; }

        .aurora-field {
            position: absolute;
            left: -3%;
            top: -2%;
            width: 106%;
            height: min(58vh, 540px);
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            mix-blend-mode: screen;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.98) 42%, rgba(0,0,0,.72) 68%, rgba(0,0,0,.26) 86%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.98) 42%, rgba(0,0,0,.72) 68%, rgba(0,0,0,.26) 86%, rgba(0,0,0,0) 100%);
        }

        .aurora-layer {
            position: absolute;
            inset: -6% -4% 0 -4%;
            pointer-events: none;
            border-radius: 50%;
            will-change: transform, opacity, filter, background-position;
        }

        .aurora-base {
            background:
                radial-gradient(40% 30% at 14% 16%, rgba(104,255,214,.42) 0%, rgba(104,255,214,.18) 34%, transparent 68%),
                radial-gradient(42% 28% at 50% 10%, rgba(118,104,255,.34) 0%, rgba(118,104,255,.14) 36%, transparent 72%),
                radial-gradient(40% 30% at 86% 16%, rgba(70,243,255,.38) 0%, rgba(70,243,255,.16) 35%, transparent 70%),
                radial-gradient(76% 48% at 50% 18%, rgba(62,114,255,.18) 0%, rgba(62,114,255,.09) 38%, transparent 72%);
            filter: blur(42px) saturate(116%);
            opacity: .94;
            animation: auroraBaseMove25 15s ease-in-out infinite alternate;
        }

        .aurora-drift {
            background:
                radial-gradient(34% 26% at 18% 18%, rgba(80,255,197,.28) 0%, transparent 70%),
                radial-gradient(34% 24% at 62% 14%, rgba(205,94,255,.22) 0%, transparent 72%),
                radial-gradient(32% 24% at 82% 18%, rgba(79,226,255,.28) 0%, transparent 72%),
                radial-gradient(60% 34% at 50% 24%, rgba(144,112,255,.14) 0%, transparent 74%);
            filter: blur(62px) saturate(124%);
            opacity: .86;
            animation: auroraDrift25 12s ease-in-out infinite alternate;
        }

        .aurora-veil {
            background:
                radial-gradient(58% 22% at 18% 16%, rgba(156,255,223,.16) 0%, transparent 74%),
                radial-gradient(62% 24% at 56% 18%, rgba(132,116,255,.16) 0%, transparent 76%),
                radial-gradient(56% 22% at 86% 16%, rgba(88,244,255,.16) 0%, transparent 74%),
                linear-gradient(to bottom, rgba(190,228,255,.05) 0%, rgba(105,155,232,.04) 24%, rgba(24,44,88,0) 100%);
            filter: blur(86px) saturate(128%);
            opacity: .70;
            animation: auroraVeil25 18s ease-in-out infinite alternate;
        }

        @keyframes auroraBaseMove25 {
            0% {
                transform: translate3d(-.5%, 0, 0) scale(1, .98);
                opacity: .88;
                filter: blur(42px) hue-rotate(0deg) saturate(112%);
            }
            50% {
                transform: translate3d(.4%, 4px, 0) scale(1.03, 1.04);
                opacity: .98;
                filter: blur(44px) hue-rotate(18deg) saturate(122%);
            }
            100% {
                transform: translate3d(.9%, 8px, 0) scale(1.05, 1.08);
                opacity: .94;
                filter: blur(42px) hue-rotate(34deg) saturate(126%);
            }
        }

        @keyframes auroraDrift25 {
            0% {
                transform: translate3d(0, 0, 0) scale(1, .98);
                opacity: .78;
                filter: blur(62px) hue-rotate(0deg) saturate(118%);
            }
            50% {
                transform: translate3d(-.6%, 5px, 0) scale(1.02, 1.05);
                opacity: .90;
                filter: blur(64px) hue-rotate(20deg) saturate(130%);
            }
            100% {
                transform: translate3d(.6%, 9px, 0) scale(1.05, 1.10);
                opacity: .84;
                filter: blur(60px) hue-rotate(36deg) saturate(134%);
            }
        }

        @keyframes auroraVeil25 {
            0% {
                transform: translate3d(-.3%, 0, 0) scale(1, 1);
                opacity: .58;
                filter: blur(86px) hue-rotate(0deg);
            }
            50% {
                transform: translate3d(.4%, 6px, 0) scale(1.02, 1.06);
                opacity: .72;
                filter: blur(90px) hue-rotate(16deg);
            }
            100% {
                transform: translate3d(.9%, 10px, 0) scale(1.04, 1.10);
                opacity: .66;
                filter: blur(88px) hue-rotate(30deg);
            }
        }

        .night-stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(220,242,255,.66) 0 1px, transparent 1.45px),
                radial-gradient(circle, rgba(135,224,255,.34) 0 1px, transparent 1.4px);
            background-size: 117px 117px, 173px 173px;
            background-position: 22px 17px, 79px 62px;
            opacity: .32;
            mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.72) 60%, transparent 88%);
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.72) 60%, transparent 88%);
        }

        .ice-field {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 235px;
            opacity: .92;
        }
        .ice-water { fill: rgba(52,80,103,.28); }

        /* ---------- LIGHT ---------- */

        .light-scene::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(68% 23% at 18% 14%, rgba(255,255,255,.16), transparent 70%),
                radial-gradient(78% 26% at 82% 28%, rgba(255,255,255,.12), transparent 74%),
                radial-gradient(70% 20% at 40% 54%, rgba(255,255,255,.10), transparent 75%);
            mix-blend-mode: screen;
            opacity: .52;
            animation: lightWaterSweep 18s ease-in-out infinite alternate;
        }

        .light-scene::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(120% 90% at 50% 12%, transparent 0 56%, rgba(255,255,255,.42) 56.3%, transparent 57.2%) no-repeat,

<style id="local-aurora-video-demo">
/* ============================================================
   Aurora video overlay
   ============================================================ */

.stock-aurora-layer {
    position: absolute;
    left: 0;
    top: -2%;
    width: 100%;
    height: min(66vh, 650px);
    z-index: 1;
    overflow: hidden;
    pointer-events: none;

    /* Keep the useful sky, then dissolve before the page's iceberg region. */
    -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,.78) 3.5%,
        #000 10%,
        #000 60%,
        rgba(0,0,0,.92) 70%,
        rgba(0,0,0,.60) 82%,
        transparent 100%
    );
    mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,.78) 3.5%,
        #000 10%,
        #000 60%,
        rgba(0,0,0,.92) 70%,
        rgba(0,0,0,.60) 82%,
        transparent 100%
    );

    opacity: 1;
    contain: layout paint;
}

/* Gentle palette glue: cyan/teal + restrained violet, matching Aurora Ice. */
.stock-aurora-layer::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(50% 58% at 17% 11%,
            rgba(76,255,218,.18),
            transparent 72%),
        radial-gradient(48% 55% at 55% 9%,
            rgba(141,101,255,.17),
            transparent 74%),
        radial-gradient(50% 56% at 87% 15%,
            rgba(80,229,255,.18),
            transparent 73%);
    mix-blend-mode: screen;
}

/* Keep motion away from the content area without crushing the aurora itself. */
.stock-aurora-layer::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
        linear-gradient(
            to bottom,
            rgba(4,13,32,0) 0%,
            rgba(4,14,34,.02) 42%,
            rgba(4,15,34,.12) 66%,
            rgba(4,14,31,.48) 84%,
            rgba(4,13,29,.82) 100%
        );
}

.stock-aurora-video {
    position: absolute;
    z-index: 1;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 12%;

    /* Small scale keeps the source horizon outside the useful crop. */
    transform: translate3d(-50%, -50%, 0) scale(1.07);
    transform-origin: center;
    backface-visibility: hidden;

    /*
       Important tuning:
       - raise brightness so the aurora remains visible most of the time
       - lower contrast so dim frames are not crushed to near-black
       - keep saturation restrained so it still belongs to the page
    */
    mix-blend-mode: screen;
    opacity: .92;
    filter:
        brightness(.70)
        contrast(1.34)
        saturate(1.10)
        hue-rotate(4deg);

    will-change: transform;
}

/* 视频实际可用后才隐藏 CSS 极光，加载失败时保留 fallback。 */
html[data-theme="dark"].aurora-media-ready .aurora-field {
    opacity: 0 !important;
    visibility: hidden;
    transition: opacity .75s ease;
}

html[data-theme="dark"].aurora-media-ready .dark-scene::before {
    opacity: .22;
    filter: blur(36px);
}

/* The video already contains natural luminance variation; keep site stars subtle. */
html[data-theme="dark"].aurora-media-ready .night-stars {
    opacity: .18;
}

/* Glass stays dark enough that a bright aurora frame never hurts text contrast. */
html[data-theme="dark"].aurora-media-ready header {
    background: rgba(7, 15, 30, .54);
}

html[data-theme="dark"].aurora-media-ready .panel {
    background: rgba(7, 14, 28, .52);
}

/* Optional diagnostics: append ?auroraDebug=1 */
.aurora-debug {
    display: none;
    position: fixed;
    left: 12px;
    bottom: 12px;
    z-index: 9999;
    max-width: min(480px, calc(100vw - 24px));
    padding: 8px 11px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(2,8,20,.88);
    color: #dff6ff;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    pointer-events: none;
}
html.aurora-debug-on .aurora-debug { display: block; }

/* Tablet / narrower desktop */
@media (max-width: 900px) {
    .stock-aurora-layer {
        top: -1%;
        height: min(60vh, 560px);
    }

    .stock-aurora-video {
        object-position: 50% 9%;
        transform: translate3d(-50%, -50%, 0) scale(1.12);
        opacity: .90;
        filter:
            brightness(.68)
            contrast(1.31)
            saturate(1.08)
            hue-rotate(4deg);

    html[data-theme="dark"].aurora-media-ready header {

    }

    html[data-theme="dark"].aurora-media-ready .panel {
        background: rgba(7, 14, 28, .57);
        backdrop-filter: blur(10px) saturate(106%);
        -webkit-backdrop-filter: blur(10px) saturate(106%);
    }
}

/* Phones: portrait source crop is unavoidable, so crop vertically rather than
   rendering a 160vw video layer. This is much cheaper for the GPU. */
@media (max-width: 640px) {
    .stock-aurora-layer {
        left: 0;
        width: 100%;
        top: 0;
        height: min(52vh, 470px);

        -webkit-mask-image: linear-gradient(
            to bottom,
            rgba(0,0,0,.84) 0%,

            transparent 100%
        );
    }

    .stock-aurora-video {
        object-position: 50% 8%;
        transform: translate3d(-50%, -50%, 0) scale(1.20);
        opacity: .88;
        filter:
            brightness(.66)
            contrast(1.28)
            saturate(1.06)
            hue-rotate(4deg);
    }

    .stock-aurora-layer::before {
        background:
            radial-gradient(74% 60% at 28% 10%,

    html[data-theme="dark"].aurora-media-ready header {

    html[data-theme="dark"].aurora-media-ready .card {

@media (max-width: 420px) {

/* Accessibility: reduced-motion uses the static CSS aurora fallback. */
@media (prefers-reduced-motion: reduce) {
    .stock-aurora-video {
        display: none;
    }
}

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    // ==== 背景随鼠标移动的光斑（无可见光标圈） ====
    const root = document.documentElement;
    const setPos = (x, y) => {
        root.style.setProperty('--mx', x + 'px');
        root.style.setProperty('--my', y + 'px');
};

    const onMove = (e) => {
        const x = e.clientX ?? (e.touches && e.touches[0].clientX) ?? innerWidth * 0.7;
        const y = e.clientY ?? (e.touches && e.touches[0].clientY) ?? innerHeight * 0.2;
        setPos(x, y);
    };

    window.addEventListener('mousemove', onMove, {passive: true});
    window.addEventListener('touchmove', onMove, {passive: true});

    // Light theme mouse ripple: a single short-lived distorted ring, not a target.
    const rippleLayer = document.getElementById('ripple-layer');
    let lastRippleAt = 0;
    let lastRippleX = -9999;
    let lastRippleY = -9999;

    function emitRipple(x, y) {
        if (!rippleLayer || root.dataset.theme !== 'light') return;
        const now = performance.now();
        const dx = x - lastRippleX;
        const dy = y - lastRippleY;

        if (now - lastRippleAt < 145 || (dx * dx + dy * dy) < 1100) return;

        const ring = document.createElement('span');
        ring.className = 'ripple-pulse';
        ring.style.setProperty('--rx', x + 'px');
        ring.style.setProperty('--ry', y + 'px');
        ring.style.setProperty('--rr', (((x * .7 + y * .3) % 16) - 8) + 'deg');
        rippleLayer.appendChild(ring);

        lastRippleAt = now;
        lastRippleX = x;
        lastRippleY = y;
        ring.addEventListener('animationend', () => ring.remove(), {once: true});
    }

    window.addEventListener('mousemove', (e) => emitRipple(e.clientX, e.clientY), {passive: true});


    // 初始定位（中心偏右上）
    setPos(innerWidth * 0.7, innerHeight * 0.2);

    // 年份
    document.getElementById('y').textContent = new Date().getFullYear();

    // ==== 轻量粒子雪花（尊重简化动效） ====
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.getElementById('fx-snow');
    const ctx = canvas.getContext('2d');
    let DPR = Math.min(devicePixelRatio || 1, 2);
    let W = 0, H = 0, particles = [], running = false;

    function resize() {
        W = canvas.width = innerWidth * DPR;
        H = canvas.height = innerHeight * DPR;
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        // 初始化粒子数量（随屏幕面积变化）
        const target = Math.min(110, Math.floor((innerWidth * innerHeight) / 18000));
        particles = Array.from({length: target}, () => spawn());
    }

    function spawn() {
        const r = Math.random() * 1.8 + .6; // 0.6 - 2.4px
        return {
            x: Math.random() * W,
            y: Math.random() * H,
            r: r * DPR,
            vy: (Math.random() * 0.5 + 0.25) * DPR, // 垂直速度
            vx: (Math.random() - .5) * 0.15 * DPR,     // 轻微飘移
            a: Math.random() * Math.PI * 2,
            swing: Math.random() * 0.35 + 0.05
        };
    }

    function tick() {
        if (!running) return;
        ctx.clearRect(0, 0, W, H);
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = 'rgba(212, 233, 255, 0.65)';
        for (const p of particles) {
            p.a += p.swing * 0.02; // 横向轻摆
            p.x += p.vx + Math.cos(p.a) * 0.12 * DPR;
            p.y += p.vy;
            if (p.y - p.r > H) {
                p.y = -p.r;
                p.x = Math.random() * W;
            }
            if (p.x < -10) p.x = W + 10;
            if (p.x > W + 10) p.x = -10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        }
        requestAnimationFrame(tick);
    }

    function start() {
        if (prefersReduced || running) return;
        running = true;
        resize();
        tick();
    }

    function stop() {
        running = false;
    }

    window.addEventListener('resize', resize);

    // ==== 右上角主题灯 + 浅海昼夜色温 ====
    const THEME_KEY = 'homepage-theme-demo-v2';
    const schemeMedia = window.matchMedia('(prefers-color-scheme: light)');
    const themeLamp = document.getElementById('theme-lamp');

    let manualTheme = null;
    try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light' || saved === 'dark') manualTheme = saved;
    } catch (_) {}

    function systemTheme() {
        return schemeMedia.matches ? 'light' : 'dark';
    }

    function activeTheme() {
        return manualTheme || systemTheme();
    }

    function syncSnowToTheme() {
        if (root.dataset.theme === 'dark') {
            start();
        } else {
            stop();
            ctx.clearRect(0, 0, W, H);
        }
    }

    function hexToRgb(hex) {
        const value = hex.replace('#', '');
        return {
            r: parseInt(value.slice(0, 2), 16),
            g: parseInt(value.slice(2, 4), 16),
            b: parseInt(value.slice(4, 6), 16)
        };
    }

    function mixHex(a, b, t) {
        const ca = hexToRgb(a);
        const cb = hexToRgb(b);
        const mix = (x, y) => Math.round(x + (y - x) * t);
        return '#' + [mix(ca.r, cb.r), mix(ca.g, cb.g), mix(ca.b, cb.b)]
            .map(v => v.toString(16).padStart(2, '0')).join('');
    }

    function rgbString(hex) {
        const c = hexToRgb(hex);
        return `${c.r}, ${c.g}, ${c.b}`;
    }

    // Light 模式的 24h 海水色盘：始终保持“温水海洋”，只改变光线与海水色温。
    const dayPalettes = [
        { t: 0.0,  surface: '#dcebf2', mid: '#b7d9dc', deep: '#7aa6b7', sand: '#dec7b2', accent: '#6d9eae', sun: '#d9d4ed', name: '月下海湾' },
        { t: 5.5,  surface: '#dff4f5', mid: '#bde3df', deep: '#79b8bd', sand: '#efd1ad', accent: '#5aaeba', sun: '#ffd2a2', name: '黎明海面' },
        { t: 7.5,  surface: '#dafafa', mid: '#b9eee6', deep: '#72c3c6', sand: '#f3d6ad', accent: '#35a9b8', sun: '#ffd184', name: '晨光浅海' },
        { t: 11.5, surface: '#d7fbff', mid: '#b5f0e9', deep: '#6bc8cc', sand: '#f4dcae', accent: '#24a7b8', sun: '#ffe3a3', name: '晴昼暖海' },
        { t: 15.5, surface: '#d9fafb', mid: '#b7eee4', deep: '#70c4c8', sand: '#f1d7ad', accent: '#2ca1b1', sun: '#ffda93', name: '午后海水' },
        { t: 18.0, surface: '#e1f3f3', mid: '#b9dfd7', deep: '#79b6bb', sand: '#f0cba5', accent: '#ad8e86', sun: '#ffbd78', name: '金色海面' },
        { t: 19.5, surface: '#e5eeee', mid: '#bfcfd1', deep: '#799baa', sand: '#e0c0ae', accent: '#9d829b', sun: '#f5b38d', name: '薄暮海湾' },
        { t: 22.0, surface: '#dfeaf1', mid: '#b6d1d5', deep: '#769dad', sand: '#d9c3b4', accent: '#738fa8', sun: '#d8cfec', name: '月下海湾' },
        { t: 24.0, surface: '#dcebf2', mid: '#b7d9dc', deep: '#7aa6b7', sand: '#dec7b2', accent: '#6d9eae', sun: '#d9d4ed', name: '月下海湾' }
    ];

    let currentDayPhase = '';

    function applyTimePalette(date = new Date()) {
        const hour = date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;

        let left = dayPalettes[0];
        let right = dayPalettes[dayPalettes.length - 1];

        for (let i = 0; i < dayPalettes.length - 1; i++) {
            if (hour >= dayPalettes[i].t && hour <= dayPalettes[i + 1].t) {
                left = dayPalettes[i];
                right = dayPalettes[i + 1];
                break;
            }
        }

        const span = Math.max(.001, right.t - left.t);
        const t = Math.min(1, Math.max(0, (hour - left.t) / span));
        const smooth = t * t * (3 - 2 * t);

        const surface = mixHex(left.surface, right.surface, smooth);
        const mid = mixHex(left.mid, right.mid, smooth);
        const deep = mixHex(left.deep, right.deep, smooth);
        const sand = mixHex(left.sand, right.sand, smooth);
        const accent = mixHex(left.accent, right.accent, smooth);
        const sun = mixHex(left.sun, right.sun, smooth);

        root.style.setProperty('--time-surface', surface);
        root.style.setProperty('--time-mid', mid);
        root.style.setProperty('--time-deep', deep);
        root.style.setProperty('--time-sand', sand);
        root.style.setProperty('--time-accent-rgb', rgbString(accent));
        root.style.setProperty('--time-sun-rgb', rgbString(sun));

        // 日光从清晨左侧升起，正午到头顶，傍晚落向右侧。
        const daylight = Math.min(1, Math.max(0, (hour - 5.5) / 14.5));
        const sunX = 14 + daylight * 76;
        const arc = Math.sin(daylight * Math.PI);
        const sunY = 22 - arc * 31;
        root.style.setProperty('--sun-x', `${sunX.toFixed(1)}%`);
        root.style.setProperty('--sun-y', `${sunY.toFixed(1)}%`);

        currentDayPhase = t < .5 ? left.name : right.name;
        updateLampText();
    }

    function updateLampText() {
        if (!themeLamp) return;
        const isLight = root.dataset.theme === 'light';
        const source = manualTheme ? '手动' : '跟随系统';
        const state = isLight ? `温水海洋 · ${currentDayPhase || '日光'}` : '冰山极光';
        themeLamp.setAttribute('aria-label', `当前：${state}（${source}），点击切换主题`);
        themeLamp.title = `当前：${state}（${source}） · 点击切换`;
    }

    function applyTheme(theme, persist = false) {
        root.dataset.theme = theme;

        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
            const color = theme === 'light'
                ? getComputedStyle(root).getPropertyValue('--time-surface').trim() || '#d8fbff'
                : '#0b1220';
            metaTheme.setAttribute('content', color);
        }

        syncSnowToTheme();
        updateLampText();

        if (persist && manualTheme) {
            try { localStorage.setItem(THEME_KEY, manualTheme); } catch (_) {}
        }
    }

    if (themeLamp) {
        themeLamp.addEventListener('click', () => {
            manualTheme = root.dataset.theme === 'light' ? 'dark' : 'light';
            applyTheme(manualTheme, true);
        });
    }

    const onSystemSchemeChange = () => {
        if (!manualTheme) applyTheme(systemTheme(), false);
    };

    if (schemeMedia.addEventListener) {
        schemeMedia.addEventListener('change', onSystemSchemeChange);
    } else if (schemeMedia.addListener) {
        schemeMedia.addListener(onSystemSchemeChange);
    }

    // 每 30 秒重新插值一次；颜色依据真实本地时间连续变化，而不是几个离散档位。
    applyTimePalette();
    setInterval(applyTimePalette, 30000);
    applyTheme(activeTheme(), false);
</script>

<script>
(() => {
    const root = document.documentElement;
    const setPos = (x, y) => {
        root.style.setProperty('--mouse-x', `${x}px`);
        root.style.setProperty('--mouse-y', `${y}px`);
    };
    const setActive = (value) => {
        root.style.setProperty('--mouse-active', value ? '1' : '0');
    };

    setPos(Math.round(window.innerWidth * 0.72), Math.round(window.innerHeight * 0.26));

    window.addEventListener('mousemove', (event) => {
        setPos(event.clientX, event.clientY);
        if (root.dataset.theme === 'dark') setActive(true);
    }, { passive: true });

    window.addEventListener('mousedown', (event) => {
        setPos(event.clientX, event.clientY);
        if (root.dataset.theme === 'dark') setActive(true);
    }, { passive: true });

    document.addEventListener('mouseleave', () => setActive(false));
    document.addEventListener('mouseout', (event) => {
        if (!event.relatedTarget) setActive(false);
    });

    window.addEventListener('blur', () => setActive(false));
    window.addEventListener('focus', () => {
        if (root.dataset.theme === 'dark') setActive(true);
    });

    window.addEventListener('touchstart', () => setActive(false), { passive: true });
})();
</script>



<script id="local-aurora-video-script">
(() => {
    const root = document.documentElement;
    const video = document.getElementById('stock-aurora-video');
    const debug = document.getElementById('aurora-debug');
    if (!video) return;

    const params = new URLSearchParams(location.search);
    const debugOn = params.get('auroraDebug') === '1';
    if (debugOn) root.classList.add('aurora-debug-on');

    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const connection =
        navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const saveData = Boolean(connection && connection.saveData);

    let loadRequested = false;

    const setDebug = (text) => {
        if (debug) debug.textContent = `Aurora: ${text}`;
        if (debugOn) console.info(`[Aurora] ${text}`);
    };

    const useFallback = (reason) => {
        root.classList.remove('aurora-media-ready');
        try { video.pause(); } catch (_) {}
        setDebug(reason);
    };

    const canUseVideo = () =>
        root.dataset.theme === 'dark' &&
        !document.hidden &&
        !reduced.matches &&
        !saveData;

    const ensureLoaded = () => {
        if (loadRequested) return;
        loadRequested = true;
        video.preload = 'auto';
        try { video.load(); } catch (_) {}
        setDebug('loading ./images/aurora.mp4');
    };

    const syncPlayback = () => {
        if (!canUseVideo()) {
            if (reduced.matches) {
                useFallback('reduced motion enabled; using CSS aurora');
            } else if (saveData) {
                useFallback('Data Saver enabled; using CSS aurora');
            } else {
                try { video.pause(); } catch (_) {}
            }
            return;
        }

        ensureLoaded();

        try { video.playbackRate = 0.90; } catch (_) {}

        if (video.readyState >= 2 && video.videoWidth > 0) {
            root.classList.add('aurora-media-ready');
        }

        video.play().catch(() => {
            // If autoplay is blocked or decoding fails, the CSS fallback remains visible.
            root.classList.remove('aurora-media-ready');
        });
    };

    const onReady = () => {
        if (!canUseVideo()) {
            syncPlayback();
            return;
        }

        root.classList.add('aurora-media-ready');
        try { video.playbackRate = 0.90; } catch (_) {}
        setDebug(
            `loaded ${video.videoWidth}×${video.videoHeight}, rate ${video.playbackRate}`
        );
        video.play().catch(() => {
            root.classList.remove('aurora-media-ready');
        });
    };

    video.addEventListener('loadeddata', onReady);
    video.addEventListener('canplay', onReady);
    video.addEventListener('error', () => {
        loadRequested = false;
        useFallback('./images/aurora.mp4 not found / could not decode; using CSS aurora');
    });

    new MutationObserver(syncPlayback).observe(root, {
        attributes: true,
        attributeFilter: ['data-theme']
    });

    document.addEventListener('visibilitychange', syncPlayback);

    if (reduced.addEventListener) {
        reduced.addEventListener('change', syncPlayback);
    }

    // Initial state: Dark loads/plays the video; Light leaves it completely idle.
    syncPlayback();
})();
</script>
